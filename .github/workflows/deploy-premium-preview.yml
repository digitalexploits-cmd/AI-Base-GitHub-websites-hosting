name: Deploy premium preview to GitHub Pages

on:
  push:
    branches: [trunk]
    paths:
      - "premium-preview/**"
      - ".github/workflows/deploy-premium-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare isolated public artifact
        run: |
          mkdir -p _site/premium-preview
          cp -R premium-preview/. _site/premium-preview/
          cat > _site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./premium-preview/"><title>AI Base³ Demo</title><a href="./premium-preview/">Open premium preview</a>
          EOF
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
