name: Deploy integrated Nexus demo to GitHub Pages

on:
  push:
    branches: [trunk]
    paths:
      - 'index.html'
      - 'aibase3_nexus.html'
      - 'aibase3_esa_engine_v3_1.html'
      - 'motor_intelligence_report.html'
      - '1728_Sentry.html'
      - 'dossier.html'
      - 'premium-preview/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare public demo artifact
        run: |
          set -euo pipefail
          mkdir -p _site

          public_files=(
            index.html
            aibase3_nexus.html
            aibase3_esa_engine_v3_1.html
            motor_intelligence_report.html
            1728_Sentry.html
          )

          for file in "${public_files[@]}"; do
            test -s "$file"
            cp "$file" _site/
          done

          if [ -s dossier.html ]; then
            cp dossier.html _site/
          fi

          if [ -d premium-preview ]; then
            mkdir -p _site/premium-preview
            cp -R premium-preview/. _site/premium-preview/
          fi

          touch _site/.nojekyll
          test -s _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
