name: Deploy integrated Nexus demo to GitHub Pages

on:
  push:
    branches: [trunk]
    paths:
      - '*.html'
      - 'premium-preview/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare public demo artifact
        run: |
          mkdir -p _site
          find . -maxdepth 1 -type f -name '*.html' -exec cp {} _site/ \;
          if [ -d premium-preview ]; then
            mkdir -p _site/premium-preview
            cp -R premium-preview/. _site/premium-preview/
          fi
          touch _site/.nojekyll
          test -f _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
